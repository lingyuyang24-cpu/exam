services:
  app:
    build:
      context: .
      args:
        CODEX_VERSION: "0.114.0"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-linext-5.3-luna}
      AGENT_SANDBOX: ${AGENT_SANDBOX:-workspace-write}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-1200}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      PORT: "8080"
    volumes:
      - agent-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agent-data:
